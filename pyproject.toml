[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leash"
version = "0.1.0"
description = "A phone-based safety layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
leash = "daemon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*", "daemon*", "shim*", "gates*", "session*", "reference-agent*"]
